openapi: 3.0.0
info:
  title: UniMate API Documentation
  version: 1.1.0
  description: Production API documentation for the UniMate Academic Management System.
servers:
  - url: /api/v1
    description: Current API Version
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Students
  - name: Teachers
  - name: Courses
  - name: Offerings
  - name: Enrollments
  - name: Schedule
  - name: Attendance
  - name: Assignments
  - name: Grades
  - name: Announcements
  - name: Notifications
  - name: Community
  - name: Admins
  - name: Events

paths:
  # ==============================
  # AUTH MODULE
  # ==============================
  /auth/login/{role}:
    post:
      tags: [Auth]
      summary: Login as a specific role
      security: []
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
            enum: [admin, student, teacher]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token (alias of /auth/refresh-token, used by the mobile client)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New access/refresh token pair
        "401":
          description: Invalid or expired refresh token
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: One-time password reset (student or teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Password reset successful

  # ==============================
  # USERS MODULE
  # ==============================
  /users/me:
    get:
      tags: [Users]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: Current user data
  /users:
    get:
      tags: [Users]
      summary: Get all users (Admin only)
      responses:
        "200":
          description: List of users
    post:
      tags: [Users]
      summary: Create a base user account (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
                role: { type: string, enum: [ADMIN, STUDENT, TEACHER] }
      responses:
        "201":
          description: User created
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: User data }
    patch:
      tags: [Users]
      summary: Update a user
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: User updated }
    delete:
      tags: [Users]
      summary: Delete a user
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: User deleted }

  # ==============================
  # STUDENTS MODULE
  # ==============================
  /students/me:
    get:
      tags: [Students]
      summary: Get logged-in student's profile
      responses:
        "200": { description: Student profile data }
  /students/me/enrollments:
    get:
      tags: [Students]
      summary: Get logged-in student's enrollments
      responses:
        "200": { description: List of enrollments }
  /students:
    get:
      tags: [Students]
      summary: Get all students (Admin Only)
      responses:
        "200": { description: List of students }
    post:
      tags: [Students]
      summary: Create a student profile (Admin Only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                roll_number: { type: string }
                department: { type: string }
                batch: { type: integer }
      responses:
        "201": { description: Student profile created }
  /students/{id}/enrollments:
    get:
      tags: [Students]
      summary: Get specific student's enrollments
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Student enrollments }
  /students/{id}:
    get:
      tags: [Students]
      summary: Get student by ID
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Student data }
    patch:
      tags: [Students]
      summary: Update a student
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Student updated }
    delete:
      tags: [Students]
      summary: Delete a student
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Student deleted }

  # ==============================
  # TEACHERS MODULE
  # ==============================
  /teachers/me:
    get:
      tags: [Teachers]
      summary: Get logged-in teacher's profile
      responses:
        "200": { description: Teacher profile data }
  /teachers/me/offerings:
    get:
      tags: [Teachers]
      summary: Get logged-in teacher's course offerings
      responses:
        "200": { description: Teacher course offerings }
  /teachers:
    get:
      tags: [Teachers]
      summary: Get all teachers
      responses:
        "200": { description: List of teachers }
    post:
      tags: [Teachers]
      summary: Create a teacher profile
      responses:
        "201": { description: Teacher profile created }
  /teachers/{id}/offerings:
    get:
      tags: [Teachers]
      summary: Get specific teacher's offerings
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Teacher offerings }
  /teachers/{id}:
    get:
      tags: [Teachers]
      summary: Get teacher by ID
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Teacher data }
    patch:
      tags: [Teachers]
      summary: Update a teacher
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Teacher updated }
    delete:
      tags: [Teachers]
      summary: Delete a teacher
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Teacher deleted }

  # ==============================
  # COURSES MODULE
  # ==============================
  /courses:
    get:
      tags: [Courses]
      summary: List all courses
      responses:
        "200": { description: Array of courses }
    post:
      tags: [Courses]
      summary: Create a new course (Admin Only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                title: { type: string }
                credit_hours: { type: integer }
                department: { type: string }
      responses:
        "201": { description: Course created }
  /courses/{id}:
    get:
      tags: [Courses]
      summary: Get course by ID
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Course details }
    patch:
      tags: [Courses]
      summary: Update a course
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Course updated }
    delete:
      tags: [Courses]
      summary: Delete a course
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Course deleted }

  # ==============================
  # OFFERINGS MODULE
  # ==============================
  /offerings:
    get:
      tags: [Offerings]
      summary: List course offerings
      parameters:
        - in: query
          name: semester
          schema: { type: string }
        - in: query
          name: course_id
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Array of offerings }
    post:
      tags: [Offerings]
      summary: Create an offering
      description: >-
        Roles: admin. Assessment weights are percentages of the final course
        grade and must total 100. Omitted weights default to 30/20/50/0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id, semester, section, capacity]
              properties:
                course_id: { type: string, format: uuid }
                teacher_id: { type: string, format: uuid, nullable: true }
                semester: { type: string }
                section: { type: string }
                capacity: { type: integer, minimum: 1, maximum: 500 }
                mid_weight: { type: number, minimum: 0, maximum: 100, default: 30 }
                sessional_weight: { type: number, minimum: 0, maximum: 100, default: 20 }
                final_weight: { type: number, minimum: 0, maximum: 100, default: 50 }
                practical_weight: { type: number, minimum: 0, maximum: 100, default: 0 }
      responses:
        "201": { description: Offering created }
        "400": { description: Validation error (e.g. weights do not total 100) }
  /offerings/{id}:
    get:
      tags: [Offerings]
      summary: Get offering by ID
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Offering data }
    patch:
      tags: [Offerings]
      summary: Update offering
      description: >-
        Roles: admin. Accepts the same assessment-weight fields as create. A
        partial weight update is validated against the offering's stored
        weights, so the merged result must still total 100.
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                course_id: { type: string, format: uuid }
                teacher_id: { type: string, format: uuid, nullable: true }
                semester: { type: string }
                section: { type: string }
                capacity: { type: integer, minimum: 1, maximum: 500 }
                mid_weight: { type: number, minimum: 0, maximum: 100 }
                sessional_weight: { type: number, minimum: 0, maximum: 100 }
                final_weight: { type: number, minimum: 0, maximum: 100 }
                practical_weight: { type: number, minimum: 0, maximum: 100 }
      responses:
        "200": { description: Offering updated }
        "400": { description: Validation error (e.g. weights do not total 100) }
    delete:
      tags: [Offerings]
      summary: Delete offering
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Offering deleted }

  # ==============================
  # ENROLLMENTS MODULE
  # ==============================
  /enrollments:
    get:
      tags: [Enrollments]
      summary: List all enrollments
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200": { description: Paginated enrollments }
    post:
      tags: [Enrollments]
      summary: Create an enrollment
      responses:
        "201": { description: Enrollment successful }
  /enrollments/student/{studentId}:
    get:
      tags: [Enrollments]
      summary: Get enrollments by student
      parameters: [{ in: path, name: studentId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Student enrollments }
  /enrollments/offering/{offeringId}:
    get:
      tags: [Enrollments]
      summary: Get the class roster for an offering
      description: >-
        Roles: admin, teacher. Teachers may only read rosters for offerings they
        own (403 otherwise). This is the source of the `student_id` values
        required by `POST /grades` and `POST /attendance`.
      parameters:
        - { in: path, name: offeringId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: Offering enrollments }
        "403": { description: Teacher does not own this offering }
        "404": { description: Offering not found }
  /enrollments/{id}:
    get:
      tags: [Enrollments]
      summary: Get enrollment by ID
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Enrollment details }
    patch:
      tags: [Enrollments]
      summary: Update enrollment
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Enrollment updated }
    delete:
      tags: [Enrollments]
      summary: Delete enrollment
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Enrollment deleted }

  # ==============================
  # SCHEDULE MODULE
  # ==============================
  # Every /schedules route below resolves the target offering and enforces
  # ownership: admins pass, teachers must own the offering, students must be
  # actively enrolled in it. Anyone else gets a 403.
  /schedules:
    post:
      tags: [Schedule]
      summary: Create a schedule
      description: "Roles: admin, teacher. Teachers may only schedule their own offerings."
      responses:
        "201": { description: Schedule created }
        "403": { description: Caller does not own this offering }
        "409": { description: Overlaps an existing schedule for this offering }
  /schedules/me:
    get:
      tags: [Schedule]
      summary: The signed-in teacher's weekly timetable
      description: >-
        Roles: teacher. `GET /schedules` is student-only, so teachers read their
        own timetable here. Scoped to the caller's teacher profile, so it only
        ever returns offerings they own. Each slot carries `enrolled_count` and
        `capacity` for the dashboard, plus any schedule exceptions.
      responses:
        "200":
          description: Timetable grouped by day of week
        "403": { description: Caller is not a teacher }
        "404": { description: No teacher profile for this account }
  /schedules/offering/{offeringId}:
    get:
      tags: [Schedule]
      summary: Get schedules by offering
      description: "Admin, the owning teacher, or an enrolled student."
      parameters: [{ in: path, name: offeringId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Schedules list }
        "403": { description: Caller has no access to this offering }
  /schedules/{id}:
    delete:
      tags: [Schedule]
      summary: Delete schedule
      description: "Roles: admin, teacher. Teachers may only delete schedules on offerings they own."
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Schedule deleted }
        "403": { description: Caller does not own this offering }
        "404": { description: Schedule not found }
  /schedules/exceptions:
    post:
      tags: [Schedule]
      summary: Create schedule exception
      description: "Roles: admin, teacher. Teachers may only add exceptions to their own offerings."
      responses:
        "201": { description: Exception created }
        "403": { description: Caller does not own this offering }
  /schedules/offering/{offeringId}/exceptions:
    get:
      tags: [Schedule]
      summary: Get exceptions by offering
      description: "Admin, the owning teacher, or an enrolled student."
      parameters: [{ in: path, name: offeringId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Exceptions list }
        "403": { description: Caller has no access to this offering }
  /schedules/exceptions/{id}:
    delete:
      tags: [Schedule]
      summary: Delete schedule exception
      description: "Roles: admin, teacher. Teachers may only delete exceptions on their own offerings."
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Exception deleted }
        "403": { description: Caller does not own this offering }
        "404": { description: Exception not found }

  # ==============================
  # ATTENDANCE MODULE
  # ==============================
  /attendance:
    post:
      tags: [Attendance]
      summary: Record attendance
      responses:
        "201": { description: Attendance recorded }
  /attendance/session/{sessionId}:
    get:
      tags: [Attendance]
      summary: Get attendance for session
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Session attendance records }
  /attendance/offering/{offeringId}:
    get:
      tags: [Attendance]
      summary: Get attendance stats for offering
      parameters: [{ in: path, name: offeringId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Offering attendance stats }
  /attendance/my:
    get:
      tags: [Attendance]
      summary: Get logged-in student's attendance summary (alias of /attendance/my/summary)
      responses:
        "200": { description: Student attendance summary }

  # ==============================
  # ASSIGNMENTS MODULE
  # ==============================
  /assignments:
    post:
      tags: [Assignments]
      summary: Create an assignment
      responses:
        "201": { description: Assignment created }
    get:
      tags: [Assignments]
      summary: List assignments (Admin sees all, Teacher sees their own offerings)
      parameters:
        - in: query
          name: offering_id
          schema: { type: string, format: uuid }
        - in: query
          name: is_done
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: Paginated list of assignments }
  /assignments/my/submissions:
    get:
      tags: [Assignments]
      summary: Get logged-in student's submitted assignments
      responses:
        "200": { description: List of submitted assignments }
  /assignments/{id}/submit:
    post:
      tags: [Assignments]
      summary: Submit (or resubmit) an assignment as the logged-in student
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileUrl: { type: string }
                textContent: { type: string }
      responses:
        "200": { description: Submission recorded }
        "400": { description: Submission deadline has passed, or neither fileUrl nor textContent provided }
        "403": { description: Not enrolled in this offering }
  /assignments/offering/{offeringId}:
    get:
      tags: [Assignments]
      summary: Get assignments by offering
      parameters: [{ in: path, name: offeringId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: List of assignments }
  /assignments/{id}:
    patch:
      tags: [Assignments]
      summary: Update assignment
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Assignment updated }
    delete:
      tags: [Assignments]
      summary: Delete assignment
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Assignment deleted }
  /assignments/{id}/done:
    patch:
      tags: [Assignments]
      summary: Mark assignment as done
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Assignment marked as done }

  # ==============================
  # GRADES MODULE
  # ==============================
  /grades:
    post:
      tags: [Grades]
      summary: Submit a grade
      responses:
        "201": { description: Grade submitted }
  /grades/offering/{offeringId}:
    get:
      tags: [Grades]
      summary: Get grades by offering
      parameters: [{ in: path, name: offeringId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Grades list }
  /grades/student/{studentId}/offering/{offeringId}/calculation:
    get:
      tags: [Grades]
      summary: Calculate course grade
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: offeringId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Calculated grade }
  /grades/student/{studentId}/transcript:
    get:
      tags: [Grades]
      summary: Get student transcript
      parameters: [{ in: path, name: studentId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Student transcript }
  /grades/my:
    get:
      tags: [Grades]
      summary: Get logged-in student's grades summary (alias of /grades/my/summary)
      responses:
        "200": { description: Student grades summary }

  # ==============================
  # ANNOUNCEMENTS MODULE
  # ==============================
  /announcements:
    post:
      tags: [Announcements]
      summary: Create an announcement
      responses:
        "201": { description: Announcement created }
    get:
      tags: [Announcements]
      summary: >-
        Get announcements. Optionally filter by offering_id, department_id, or semester;
        with no filter, returns a role-aware default (student: relevant to their
        department/enrollments; teacher: their department; admin: most recent institution-wide).
        Each item includes is_read for the caller.
      parameters:
        - in: query
          name: offering_id
          schema: { type: string, format: uuid }
        - in: query
          name: department_id
          schema: { type: integer }
        - in: query
          name: semester
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: List of announcements }
  /announcements/{id}:
    get:
      tags: [Announcements]
      summary: Get a single announcement by ID (includes is_read for the caller)
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Announcement data }
        "404": { description: Announcement not found }
    patch:
      tags: [Announcements]
      summary: Update announcement
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Announcement updated }
    delete:
      tags: [Announcements]
      summary: Delete announcement
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Announcement deleted }
  /announcements/{id}/read:
    patch:
      tags: [Announcements]
      summary: Mark an announcement as read by the logged-in user
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Announcement marked as read }
        "404": { description: Announcement not found }

  # ==============================
  # NOTIFICATIONS MODULE
  # ==============================
  /notifications/token:
    post:
      tags: [Notifications]
      summary: Register notification token
      responses:
        "201": { description: Token registered }
  /notifications:
    get:
      tags: [Notifications]
      summary: Get user notifications
      responses:
        "200": { description: Notifications list }
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Notification marked read }

  # ==============================
  # ADMINS MODULE
  # ==============================
  /admins/me:
    get:
      tags: [Admins]
      summary: Get logged-in admin's profile
      responses:
        "200": { description: Admin data }
  /admins:
    get:
