  # ==============================
  # EVENTS MODULE
  # ==============================
  /events/upcoming:
    get:
      tags: [Events]
      summary: Get the next upcoming event(s)
      security: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 1 }
      responses:
        "200": { description: List of upcoming events }
  /events:
    get:
      tags: [Events]
      summary: List all events
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: Paginated list of events }
    post:
      tags: [Events]
      summary: Create an event
      description: "Roles: admin. Reads on this module are public; writes are not."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date]
              properties:
                title: { type: string, minLength: 2, maxLength: 160 }
                description: { type: string, maxLength: 2000, nullable: true }
                date: { type: string, format: date-time }
                location: { type: string, maxLength: 160, nullable: true }
      responses:
        "201": { description: Event created }
        "400": { description: Validation error }
        "401": { description: Authentication required }
        "403": { description: Caller is not an admin }
  /events/{id}:
    get:
      tags: [Events]
      summary: Get a single event by ID
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Event data }
        "404": { description: Event not found }
    patch:
      tags: [Events]
      summary: Update an event
      description: "Roles: admin."
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 2, maxLength: 160 }
                description: { type: string, maxLength: 2000, nullable: true }
                date: { type: string, format: date-time }
                location: { type: string, maxLength: 160, nullable: true }
      responses:
        "200": { description: Event updated }
        "403": { description: Caller is not an admin }
        "404": { description: Event not found }
    delete:
      tags: [Events]
      summary: Delete an event
      description: "Roles: admin."
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Event deleted }
        "403": { description: Caller is not an admin }
        "404": { description: Event not found }
